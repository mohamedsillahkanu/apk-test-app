<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sillah Kanu Series &mdash; Make the Pair</title>
<style>
  :root{--paper:#FFFDF6;--board:#F3EAD6;--ink:#1A1A1A;--rule:#D8CBAE;
    --tray:#3E2A18;--tray2:#573A21;--tile:56px;
    --font-hand:"Comic Sans MS","Chalkboard SE","Segoe Print","Trebuchet MS",sans-serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:var(--font-hand);background:var(--board);color:var(--ink);
    overflow:hidden;-webkit-text-size-adjust:100%;touch-action:manipulation}
  .shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{flex:0 0 auto;text-align:center;padding:7px 10px;background:var(--paper);border-bottom:3px solid var(--ink)}
  header h1{margin:0;font-size:clamp(13px,3.6vw,24px);line-height:1.2;
    text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
  header p{margin:4px 0 0;font-size:clamp(10px,2.6vw,13px);color:#6B5A42}
  main{flex:1;min-height:0;display:flex;justify-content:center;padding:8px;overflow:hidden}
  .card{flex:1;min-width:0;min-height:0;max-width:940px;width:100%;
    background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:10px;
    display:flex;flex-direction:column;gap:6px}
  /* reference picture sits on top (narrow) or on the left (wide) */
  .board{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:8px;position:relative}
  .rowwrap{display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,26px);
    width:100%;min-height:0;flex:1}
  .ref{display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    background:#FFE9A8;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);
    border-radius:18px;padding:5px;
    width:clamp(112px,30vw,232px);height:clamp(112px,30vw,232px)}
  .ref img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .slots{display:flex;gap:clamp(6px,2.4vw,18px);flex:0 0 auto}
  .cell{display:flex;flex-direction:column;align-items:center;gap:3px}
  .cell span{font-size:clamp(10px,2.6vw,14px);color:#6B5A42}
  .drop{display:flex;align-items:flex-end;justify-content:center;overflow:hidden;
    background:#fff;border:5px dashed var(--rule);border-radius:16px;padding:4px;
    width:clamp(72px,19vw,138px);height:clamp(104px,27vw,196px);
    transition:transform .12s ease,border-color .12s ease,background .12s ease}
  .drop img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .drop.over{border-color:#1FA13A;background:#EFFBEF;transform:scale(1.05)}
  .drop.right{border:5px solid #1FA13A;background:#EFFBEF}
  .drop.wrong{border-color:#E8112D;animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
    40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  .face{position:absolute;left:50%;top:2px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;
    background:#FFE9A8;border:3px solid var(--ink);border-radius:22px;padding:4px 15px;
    font-size:clamp(12px,3.2vw,18px);opacity:0;transition:opacity .2s ease;pointer-events:none;z-index:4}
  .face.show{opacity:1}
  .face svg{width:24px;height:24px;display:block}
  .balloons{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .balloon{position:absolute;bottom:-90px;width:44px;height:74px;animation:rise 2.6s ease-out forwards}
  .balloon svg{width:100%;height:100%;display:block}
  @keyframes rise{0%{transform:translateY(0) rotate(0)}10%{opacity:1}80%{opacity:1}
    100%{transform:translateY(calc(-1 * var(--rise))) rotate(var(--tw));opacity:0}}
  .score{flex:0 0 auto;text-align:center;font-size:clamp(11px,3vw,15px);color:#6B5A42}
  .tray{flex:0 0 auto;background:linear-gradient(var(--tray2),var(--tray));
    border-top:4px solid #241505;padding:6px 8px max(8px,env(safe-area-inset-bottom))}
  .traytop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
  .traytop p{margin:0;color:#FFE9C4;font-size:clamp(10px,2.8vw,13px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .traytop button{flex:0 0 auto;font-family:var(--font-hand);font-size:clamp(11px,3vw,14px);
    padding:6px 10px;border:2px solid #241505;border-radius:9px;background:#FFE9C4;cursor:pointer}
  .kids{display:grid;gap:var(--gap);padding:2px 0 4px;justify-content:center;
    grid-template-columns:repeat(var(--cols), var(--tile))}
  .tile{width:var(--tile);height:calc(var(--tile) * 1.5);padding:2px;
    border:3px solid var(--ink);border-radius:9px;background:#fff;cursor:grab;touch-action:none;
    box-shadow:0 3px 0 #241505;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
  .tile img{max-width:100%;max-height:100%;object-fit:contain;display:block;pointer-events:none}
  .tile.picked{background:#FFE9A8;transform:translateY(-4px)}
  .tile.hidden{visibility:hidden}
  .tile.done{opacity:.25;pointer-events:none}
  .flying{position:fixed;z-index:50;pointer-events:none;margin:0;
    box-shadow:0 8px 0 rgba(36,21,5,.35);transform:scale(1.12)}
  /* wide screens: reference on the LEFT, slots to its right */
  @media (min-width:760px){
    .card{padding:14px}
    .rowwrap{gap:34px}
  }
  @media (max-height:720px) and (orientation:portrait){header p{display:none}}
  @media (max-height:560px) and (orientation:landscape){
    header{padding:4px 8px}header p{display:none}main{padding:5px}.card{padding:8px;gap:4px}
    .ref{width:clamp(80px,20vh,150px);height:clamp(80px,20vh,150px)}
    .drop{width:clamp(56px,13vh,104px);height:clamp(80px,19vh,148px)}
    .score{font-size:11px}}
  @media (prefers-reduced-motion:reduce){.balloon{animation-duration:.01s}.drop.wrong{animation:none}}
</style>
</head>
<body>
<div class="shell">
<header>
  <h1>Sillah Kanu Series &mdash; Make the Pair</h1>
  <p>Look at the picture, then find the same boy and the same girl</p>
</header>
<main>
  <div class="card">
    <div class="board" id="board">
      <div class="rowwrap">
        <div class="ref" id="ref"></div>
        <div class="slots" id="slots"></div>
      </div>
      <div class="balloons" id="balloons"></div>
      <div class="face" id="face"><span id="faceIcon"></span><span id="faceText"></span></div>
    </div>
    <p class="score" id="score">Pairs made 0</p>
  </div>
</main>
<div class="tray">
  <div class="traytop">
    <p id="hint">Find the boy and the girl from the picture</p>
    <button id="again">New picture</button>
  </div>
  <div class="kids" id="kids"></div>
</div>
</div>

const refEl=document.getElementById("ref"), trayEl=document.getElementById("kids");
const slotsEl=document.getElementById("slots");
let dropB=null, dropG=null;
function buildSlots(boyLeft){
  slotsEl.innerHTML="";
  const roles = boyLeft ? ["boy","girl"] : ["girl","boy"];
  const map={};
  roles.forEach(role=>{
    const cell=document.createElement("div"); cell.className="cell";
    const lab=document.createElement("span"); lab.textContent=role;
    const d=document.createElement("div"); d.className="drop"; d.dataset.role=role;
    cell.appendChild(lab); cell.appendChild(d); slotsEl.appendChild(cell);
    map[role]=d;
  });
  dropB=map.boy; dropG=map.girl;
  [dropB,dropG].forEach(s=>s.addEventListener("click",()=>{ if(picked) tryDrop(s,picked.i,picked.role); }));
}
const faceEl=document.getElementById("face"), balloonBox=document.getElementById("balloons");
let target=0, made=0, busy=false, picked=null, solved={boy:false,girl:false};

const canSpeak="speechSynthesis" in window; let voice=null;
function pickVoice(){ if(!canSpeak) return null; let vs=[];
  try{ vs=speechSynthesis.getVoices()||[]; }catch(e){ return null; }
  const en=vs.filter(v=>/^en/i.test(v.lang||""));
  return en.find(v=>/GB|UK/i.test(v.lang))||en[0]||vs[0]||null; }
if(canSpeak){ voice=pickVoice(); try{ speechSynthesis.onvoiceschanged=()=>{voice=pickVoice();}; }catch(e){} }
function say(t,done){ let c=false; const fin=()=>{ if(!c){c=true; if(done) done();} };
  if(!canSpeak){ setTimeout(fin,700); return; }
  try{ speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t); u.rate=.8; u.pitch=1.15;
    u.lang=(voice&&voice.lang)||"en-GB"; if(voice) u.voice=voice;
    u.onend=fin; u.onerror=fin; speechSynthesis.speak(u); setTimeout(fin,900+t.length*90);
  }catch(e){ setTimeout(fin,700); } }

function src(i,role){ return "data:image/jpeg;base64,"+PAIRS[i][role]; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function buildTray(){
  trayEl.innerHTML="";
  const items=[];
  PAIRS.forEach((p,i)=>{ items.push({i,role:"boy"}); items.push({i,role:"girl"}); });
  shuffle(items).forEach(it=>{
    const el=document.createElement("button");
    el.className="tile"; el.dataset.i=it.i; el.dataset.role=it.role;
    el.setAttribute("aria-label", it.role);
    el.innerHTML='<img alt="" src="'+src(it.i,it.role)+'">';
    trayEl.appendChild(el);
  });
  fitTiles();
}
function fitTiles(){
  const box=trayEl.parentElement.getBoundingClientRect(); const avail=box.width-16;
  if(avail<60) return;
  const short=window.innerHeight<560, count=PAIRS.length*2;
  const budget=Math.max(84,Math.min(window.innerHeight*(short?0.44:0.36),350));
  const gap=window.innerWidth<420?4:6;
  let best={size:0,cols:10};
  for(let cols=5; cols<=15; cols++){
    const rows=Math.ceil(count/cols);
    const byW=(avail-(cols-1)*gap)/cols;
    const byH=((budget-(rows-1)*gap-26)/rows)/1.5;
    const size=Math.min(byW,byH);
    if(size>best.size) best={size,cols};
  }
  const size=Math.max(22,Math.min(76,Math.floor(best.size)));
  const r=document.documentElement.style;
  r.setProperty("--tile",size+"px"); r.setProperty("--cols",best.cols); r.setProperty("--gap",gap+"px");
}
let ft=null;
window.addEventListener("resize",()=>{clearTimeout(ft);ft=setTimeout(fitTiles,90);});
window.addEventListener("orientationchange",()=>setTimeout(fitTiles,140));

function newRound(speak){
  let n=target; while(n===target) n=Math.floor(Math.random()*PAIRS.length);
  target=n; solved={boy:false,girl:false}; busy=false;
  refEl.innerHTML='<img alt="" src="'+src(target,"both")+'">';
  buildSlots(PAIRS[target].boyLeft);        // left slot matches the child on the left
  [dropB,dropG].forEach(d=>{ d.innerHTML=""; d.className="drop"; });
  faceEl.classList.remove("show");
  buildTray(); clearPick();
  if(speak) say("Look at the picture. Find the same boy and the same girl.");
}
function clearPick(){ picked=null; [...trayEl.children].forEach(t=>t.classList.remove("picked")); }
function showFace(kind,text){
  document.getElementById("faceIcon").innerHTML = kind==="sad"
   ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFD200" stroke="#1A1A1A" stroke-width="2"/><circle cx="9" cy="10" r="1.5" fill="#1A1A1A"/><circle cx="15" cy="10" r="1.5" fill="#1A1A1A"/><path d="M8 17c1.6-2.2 6.4-2.2 8 0" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/></svg>'
   : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFD200" stroke="#1A1A1A" stroke-width="2"/><circle cx="9" cy="10" r="1.5" fill="#1A1A1A"/><circle cx="15" cy="10" r="1.5" fill="#1A1A1A"/><path d="M8 14c1.6 2.2 6.4 2.2 8 0" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/></svg>';
  document.getElementById("faceText").textContent=text; faceEl.classList.add("show");
}
function popBalloons(){
  const cols=["#E8112D","#1E90FF","#1FA13A","#7A1FD1","#F5821F","#FF3EA5","#FFD200"];
  const b0=document.getElementById("board").getBoundingClientRect();
  const rise=Math.round(b0.height+150), flight=2600, spread=500;
  for(let i=0;i<9;i++){ const b=document.createElement("div"); b.className="balloon";
    b.style.left=(6+Math.random()*84)+"%"; b.style.animationDelay=(Math.random()*spread)+"ms";
    b.style.setProperty("--rise",rise+"px"); b.style.setProperty("--tw",(Math.random()*40-20)+"deg");
    const c=cols[i%cols.length];
    b.innerHTML='<svg viewBox="0 0 44 74"><path d="M22,2 C34,2 40,12 40,22 C40,34 31,44 22,44 C13,44 4,34 4,22 C4,12 10,2 22,2 Z" fill="'+c+'" stroke="#1A1A1A" stroke-width="2.5"/><path d="M22,43 L18,50 L26,50 Z" fill="'+c+'" stroke="#1A1A1A" stroke-width="2.5"/><path d="M22,50 C28,58 16,62 22,72" fill="none" stroke="#1A1A1A" stroke-width="2"/><ellipse cx="14" cy="16" rx="4" ry="6" fill="#fff" opacity=".45"/></svg>';
    balloonBox.appendChild(b); setTimeout(()=>b.remove(),flight+spread+400); }
  return flight+spread;
}
function markDone(i,role){
  [...trayEl.children].forEach(t=>{ if(+t.dataset.i===i && t.dataset.role===role) t.classList.add("done"); });
}
function tryDrop(slot, i, role){
  if(busy) return;
  const want=slot.dataset.role;
  if(role===want && i===target && !solved[want]){
    slot.innerHTML='<img alt="" src="'+src(i,role)+'">';
    slot.classList.remove("over"); slot.classList.add("right");
    solved[want]=true; markDone(i,role);
    if(solved.boy && solved.girl){
      busy=true; made++;
      document.getElementById("score").textContent="Pairs made "+made;
      showFace("happy","Well done!");
      const flight=popBalloons(); let waiting=2;
      const ready=()=>{ if(--waiting===0) newRound(true); };
      say("Well done! They walk to school together", ready);
      setTimeout(ready, flight);
    } else {
      showFace("happy", want==="boy" ? "Good! Now the girl" : "Good! Now the boy");
      say(want==="boy" ? "Good. Now find the girl" : "Good. Now find the boy");
      setTimeout(()=>faceEl.classList.remove("show"),1500);
    }
  } else {
    slot.classList.remove("over","wrong"); void slot.offsetWidth;
    slot.classList.add("wrong"); showFace("sad","Try again"); say("Try again");
    setTimeout(()=>{ slot.classList.remove("wrong"); faceEl.classList.remove("show"); },1500);
  }
  clearPick();
}
let drag=null;
function slotAt(x,y){
  for(const s of [dropB,dropG]){
    const r=s.getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom) return s;
  }
  return null;
}
trayEl.addEventListener("pointerdown",e=>{
  const tile=e.target.closest(".tile"); if(!tile||busy||tile.classList.contains("done")) return;
  try{ tile.setPointerCapture(e.pointerId); }catch(err){}
  const r=tile.getBoundingClientRect(); const g=tile.cloneNode(true);
  g.classList.add("flying"); g.style.width=r.width+"px"; g.style.height=r.height+"px";
  g.style.left=r.left+"px"; g.style.top=r.top+"px";
  document.body.appendChild(g); tile.classList.add("hidden");
  drag={tile,ghost:g,id:e.pointerId,dx:e.clientX-r.left,dy:e.clientY-r.top,moved:false,startX:e.clientX,startY:e.clientY};
});
window.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.id) return;
  drag.ghost.style.left=(e.clientX-drag.dx)+"px"; drag.ghost.style.top=(e.clientY-drag.dy)+"px";
  if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>6) drag.moved=true;
  const s=slotAt(e.clientX,e.clientY);
  [dropB,dropG].forEach(d=>d.classList.toggle("over", d===s && !busy));
});
window.addEventListener("pointerup",e=>{
  if(!drag||e.pointerId!==drag.id) return;
  const {tile,ghost,moved}=drag; ghost.remove(); tile.classList.remove("hidden");
  [dropB,dropG].forEach(d=>d.classList.remove("over")); drag=null;
  if(moved){ const s=slotAt(e.clientX,e.clientY); if(s) tryDrop(s,+tile.dataset.i,tile.dataset.role); }
  else { clearPick(); picked={i:+tile.dataset.i,role:tile.dataset.role}; tile.classList.add("picked"); }
});
window.addEventListener("pointercancel",()=>{ if(!drag) return;
  drag.ghost.remove(); drag.tile.classList.remove("hidden");
  [dropB,dropG].forEach(d=>d.classList.remove("over")); drag=null; });
document.getElementById("again").onclick=()=>newRound(true);
refEl.addEventListener("click",()=>say("Find the same boy and the same girl"));
newRound(false);
</script>
