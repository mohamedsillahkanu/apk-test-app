<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sillah Kanu Series — Factorising Practice</title>
<style>
  :root{
    --paper:#FFFDF6;
    --board:#F3EAD6;
    --ink:#1A1A1A;
    --rule:#D8CBAE;
    --tray:#3E2A18;
    --tray2:#573A21;
    --good:#1FA13A;
    --bad:#E8112D;
    --font-hand:"Comic Sans MS","Chalkboard SE","Segoe Print","Trebuchet MS",sans-serif;
    --font-math:"Cambria Math","Georgia","Times New Roman",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:var(--font-hand);background:var(--board);color:var(--ink);
    overflow:hidden;-webkit-text-size-adjust:100%;
  }
  .shell{display:flex;flex-direction:column;height:100vh;height:100dvh}

  header{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:7px 10px;background:var(--paper);border-bottom:3px solid var(--ink);
  }
  header h1{
    flex:1;margin:0;font-size:clamp(12px,3.2vw,20px);line-height:1.2;
    text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;
  }
  .clock, .tally{
    flex:0 0 auto;font-size:clamp(13px,3.4vw,19px);font-weight:bold;
    border:3px solid var(--ink);border-radius:12px;padding:4px 10px;background:#fff;
  }
  .clock.low{background:#FFD9D9;color:var(--bad)}
  .tally{background:#FFE9A8}

  main{flex:1;min-height:0;display:flex;justify-content:center;padding:8px;overflow:auto}
  .card{
    flex:1;min-width:0;max-width:820px;width:100%;
    background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:10px;
  }
  .lead{margin:0 0 8px;font-size:clamp(11px,3vw,15px);color:#6B5A42}

  .q{
    display:flex;align-items:center;flex-wrap:wrap;gap:8px;
    padding:8px 6px;border-bottom:2px dashed var(--rule);
  }
  .q:last-of-type{border-bottom:0}
  .num{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;
    border:2px solid var(--ink);background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;
  }
  .expr{
    flex:0 0 auto;font-family:var(--font-math);font-size:clamp(17px,4.6vw,26px);
    min-width:8.5em;
  }
  .eq{flex:0 0 auto;font-family:var(--font-math);font-size:clamp(17px,4.6vw,26px)}
  .slot{
    flex:0 0 auto;min-width:clamp(78px,22vw,116px);height:clamp(38px,10vw,50px);
    border:3px dashed var(--rule);border-radius:10px;background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-math);font-size:clamp(15px,4.2vw,22px);cursor:pointer;
  }
  .slot.over{border-color:var(--good);background:#EFFBEF}
  .slot.filled{border:3px solid var(--ink);background:#FFF3D0}
  .mark{flex:0 0 auto;font-size:clamp(16px,4.4vw,24px);width:1.4em;text-align:center}
  .q.right .slot.filled{border-color:var(--good);background:#EFFBEF}
  .q.wrong .slot.filled{border-color:var(--bad);background:#FFECEC}
  .answer{
    flex:1 1 100%;margin:2px 0 0;font-family:var(--font-math);
    font-size:clamp(13px,3.4vw,18px);color:var(--bad);
  }
  .answer.ok{color:var(--good)}
  .workwrap{flex:1 1 100%}
  .workbtn{
    font-family:var(--font-hand);font-size:clamp(11px,2.9vw,14px);
    padding:4px 10px;border:2px solid var(--ink);border-radius:9px;
    background:#FFF3D0;cursor:pointer;margin-top:4px;
  }
  ol.work{
    display:none;margin:6px 0 2px;padding-left:22px;
    font-family:var(--font-math);font-size:clamp(12px,3.1vw,16px);line-height:1.5;
  }
  ol.work.show{display:block}
  ol.work li{margin:3px 0}

  .tray{
    flex:0 0 auto;background:linear-gradient(var(--tray2),var(--tray));
    border-top:4px solid #241505;padding:6px 8px max(8px,env(safe-area-inset-bottom));
  }
  .traytop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
  .traytop p{margin:0;color:#FFE9C4;font-size:clamp(10px,2.8vw,13px)}
  .traytop div{display:flex;gap:6px}
  .traytop button{
    font-family:var(--font-hand);font-size:clamp(11px,3vw,14px);
    padding:6px 10px;border:2px solid #241505;border-radius:9px;background:#FFE9C4;cursor:pointer;
  }
  .traytop button:disabled{opacity:.5;cursor:default}
  .pool{
    display:flex;flex-wrap:wrap;gap:7px;justify-content:center;
    max-height:34vh;overflow-y:auto;
  }
  .piece{
    flex:0 0 auto;min-width:clamp(74px,20vw,110px);height:clamp(38px,10vw,48px);
    border:3px solid var(--ink);border-radius:11px;background:#fff;
    font-family:var(--font-math);font-size:clamp(15px,4vw,21px);
    display:flex;align-items:center;justify-content:center;
    cursor:grab;touch-action:none;box-shadow:0 3px 0 #241505;
  }
  .piece.picked{background:#FFE9A8;transform:translateY(-3px)}
  .piece.hidden{visibility:hidden}
  .flying{position:fixed;z-index:60;pointer-events:none;transform:scale(1.08);
          box-shadow:0 8px 0 rgba(36,21,5,.35)}

  .over-panel{
    position:fixed;inset:0;background:rgba(26,26,26,.55);
    display:none;align-items:center;justify-content:center;padding:16px;z-index:70;
  }
  .over-panel.show{display:flex}
  .sheet{
    background:var(--paper);border:4px solid var(--ink);border-radius:16px;
    padding:18px;max-width:340px;width:100%;text-align:center;
  }
  .sheet h2{margin:0 0 6px;font-size:clamp(18px,5vw,26px)}
  .sheet .big{font-size:clamp(30px,9vw,46px);font-weight:bold;margin:6px 0}
  .sheet p{margin:6px 0;font-size:clamp(12px,3.2vw,16px)}
  .sheet button{
    margin-top:10px;font-family:var(--font-hand);font-size:clamp(13px,3.6vw,17px);
    padding:9px 16px;border:3px solid var(--ink);border-radius:12px;background:#FFE9A8;cursor:pointer;
  }
</style>
</head>
<body>
<div class="shell">

<header>
  <h1>Factorising Practice</h1>
  <span class="tally" id="tally">0 / 5</span>
  <span class="clock" id="clock">5:00</span>
</header>

<main>
  <div class="card">
    <p class="lead">Factorise each quadratic. Drag two brackets from the box below into the spaces. Either order is fine.</p>
    <div id="questions"></div>
  </div>
</main>

<div class="tray">
  <div class="traytop">
    <p id="hint">Drag the brackets up into the spaces</p>
    <div>
      <button id="mark">Mark my work</button>
      <button id="fresh">New 5 questions</button>
    </div>
  </div>
  <div class="pool" id="pool"></div>
</div>

</div>

<div class="over-panel" id="overPanel">
  <div class="sheet">
    <h2 id="overTitle">Time is up</h2>
    <p class="big" id="overScore">0 / 5</p>
    <p id="overTime"></p>
    <p id="overNote"></p>
    <button id="overWorking">See the working</button>
    <button id="overAgain">New 5 questions</button>
  </div>
</div>

<script>
/* ================= the question bank ================= */
const BANK = [
  {q:"x\u00B2 + 5x + 6",   a:["(x+2)","(x+3)"]},
  {q:"x\u00B2 + 7x + 12",  a:["(x+3)","(x+4)"]},
  {q:"x\u00B2 + 9x + 20",  a:["(x+4)","(x+5)"]},
  {q:"x\u00B2 + 8x + 7",   a:["(x+1)","(x+7)"]},
  {q:"x\u00B2 + 6x + 8",   a:["(x+2)","(x+4)"]},
  {q:"x\u00B2 + 10x + 21", a:["(x+3)","(x+7)"]},
  {q:"x\u00B2 + 11x + 24", a:["(x+3)","(x+8)"]},
  {q:"x\u00B2 \u2212 5x + 6",  a:["(x\u22122)","(x\u22123)"]},
  {q:"x\u00B2 \u2212 7x + 10", a:["(x\u22122)","(x\u22125)"]},
  {q:"x\u00B2 \u2212 9x + 18", a:["(x\u22123)","(x\u22126)"]},
  {q:"x\u00B2 \u2212 8x + 15", a:["(x\u22123)","(x\u22125)"]},
  {q:"x\u00B2 + x \u2212 6",   a:["(x+3)","(x\u22122)"]},
  {q:"x\u00B2 + 2x \u2212 8",  a:["(x+4)","(x\u22122)"]},
  {q:"x\u00B2 \u2212 x \u2212 12",  a:["(x+3)","(x\u22124)"]},
  {q:"x\u00B2 \u2212 2x \u2212 15", a:["(x+3)","(x\u22125)"]},
  {q:"x\u00B2 + 3x \u2212 10",  a:["(x+5)","(x\u22122)"]},
  {q:"x\u00B2 \u2212 4x \u2212 21", a:["(x+3)","(x\u22127)"]},
  {q:"x\u00B2 + 4x \u2212 12",  a:["(x+6)","(x\u22122)"]}
];
const MINUS = "\u2212";
function root(f){                       // "(x+2)" or "(x\u22123)" -> 2 or -3
  const m = f.match(/x([+\u2212])(\d+)/);
  return m[1] === "+" ? Number(m[2]) : -Number(m[2]);
}
function sgn(n){ return String(n).replace("-", MINUS); }
function brk(n){ return n < 0 ? "(" + sgn(n) + ")" : String(n); }
function working(item){
  const p = root(item.a[0]), q = root(item.a[1]);
  const b = p + q, c = p * q;
  return [
    "Look for two numbers that multiply to " + sgn(c) + " and add to " + sgn(b) + ".",
    "They are " + sgn(p) + " and " + sgn(q) + ", because " + brk(p) + " \u00D7 " + brk(q)
      + " = " + sgn(c) + " and " + brk(p) + " + " + brk(q) + " = " + sgn(b) + ".",
    "So " + item.q + " = " + item.a[0] + item.a[1] + "."
  ];
}

const SPARE = ["(x+1)","(x+6)","(x+9)","(x\u22121)","(x\u22124)","(x\u22126)","(x+8)","(x\u22128)"];

const TOTAL_TIME = 5 * 60;          // five minutes
let quiz = [];                      // the five questions in play
let left = TOTAL_TIME;
let ticker = null;
let started = false;
let finished = false;
let picked = null;                  // piece chosen by tapping

const qBox   = document.getElementById("questions");
const poolEl = document.getElementById("pool");
const clockEl = document.getElementById("clock");
const tallyEl = document.getElementById("tally");

function shuffle(a){
  for(let i = a.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ================= build a fresh set ================= */
function build(){
  clearInterval(ticker);
  started = false; finished = false;
  left = TOTAL_TIME;
  picked = null;
  showClock();
  tallyEl.textContent = "0 / 5";
  document.getElementById("overPanel").classList.remove("show");
  document.getElementById("mark").disabled = false;
  document.getElementById("hint").textContent = "Drag the brackets up into the spaces";

  quiz = shuffle([...BANK]).slice(0,5);

  qBox.innerHTML = "";
  quiz.forEach((item,i)=>{
    const row = document.createElement("div");
    row.className = "q"; row.dataset.i = i;
    row.innerHTML =
      '<span class="num">' + (i+1) + '</span>' +
      '<span class="expr">' + item.q + '</span>' +
      '<span class="eq">=</span>' +
      '<div class="slot" data-q="' + i + '" data-s="0"></div>' +
      '<div class="slot" data-q="' + i + '" data-s="1"></div>' +
      '<span class="mark"></span>';
    qBox.appendChild(row);
  });

  // every bracket the five answers need, plus a few spares to think about
  const need = [];
  quiz.forEach(item => item.a.forEach(f => need.push(f)));
  const spares = shuffle([...SPARE]).filter(s => true).slice(0,4);
  const pieces = shuffle([...need, ...spares]);
  poolEl.innerHTML = "";
  pieces.forEach(p=>{
    const b = document.createElement("button");
    b.className = "piece"; b.textContent = p; b.dataset.f = p;
    poolEl.appendChild(b);
  });
}

/* ================= the clock ================= */
function showClock(){
  const m = Math.floor(left/60), s = left % 60;
  clockEl.textContent = m + ":" + String(s).padStart(2,"0");
  clockEl.classList.toggle("low", left <= 60);
}
function startClock(){
  if(started || finished) return;
  started = true;
  ticker = setInterval(()=>{
    left--;
    showClock();
    if(left <= 0){
      clearInterval(ticker);
      finish(true);
    }
  }, 1000);
}

/* ================= filling the spaces ================= */
function slotsOf(i){ return [...qBox.querySelectorAll('.slot[data-q="' + i + '"]')]; }

function place(piece, slot){
  if(finished) return;
  startClock();
  // whatever was in the slot goes back to the box
  if(slot.dataset.f) returnPiece(slot);
  slot.textContent = piece.dataset.f;
  slot.dataset.f = piece.dataset.f;
  slot.classList.add("filled");
  piece.remove();
  clearPick();
  countFilled();
}
function returnPiece(slot){
  if(!slot.dataset.f) return;
  const b = document.createElement("button");
  b.className = "piece"; b.textContent = slot.dataset.f; b.dataset.f = slot.dataset.f;
  poolEl.appendChild(b);
  slot.textContent = ""; delete slot.dataset.f;
  slot.classList.remove("filled");
  countFilled();
}
function countFilled(){
  const filled = qBox.querySelectorAll(".slot.filled").length;
  document.getElementById("hint").textContent =
    filled === 10 ? "All done — press Mark my work" : (filled + " of 10 brackets placed");
  return filled;
}
function clearPick(){
  picked = null;
  [...poolEl.children].forEach(p=>p.classList.remove("picked"));
}

/* ================= dragging ================= */
let drag = null;
function slotAt(x,y){
  const all = [...qBox.querySelectorAll(".slot")];
  for(const s of all){
    const r = s.getBoundingClientRect();
    if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return s;
  }
  return null;
}
poolEl.addEventListener("pointerdown", e=>{
  const piece = e.target.closest(".piece");
  if(!piece || finished) return;
  try{ piece.setPointerCapture(e.pointerId); }catch(err){}
  const r = piece.getBoundingClientRect();
  const ghost = piece.cloneNode(true);
  ghost.classList.add("flying");
  ghost.style.width = r.width + "px"; ghost.style.height = r.height + "px";
  ghost.style.left = r.left + "px";   ghost.style.top = r.top + "px";
  document.body.appendChild(ghost);
  piece.classList.add("hidden");
  drag = {piece, ghost, id:e.pointerId, dx:e.clientX-r.left, dy:e.clientY-r.top,
          moved:false, sx:e.clientX, sy:e.clientY};
});
window.addEventListener("pointermove", e=>{
  if(!drag || e.pointerId !== drag.id) return;
  drag.ghost.style.left = (e.clientX - drag.dx) + "px";
  drag.ghost.style.top  = (e.clientY - drag.dy) + "px";
  if(Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) > 6) drag.moved = true;
  const s = slotAt(e.clientX, e.clientY);
  qBox.querySelectorAll(".slot").forEach(x=>x.classList.toggle("over", x === s && !finished));
});
window.addEventListener("pointerup", e=>{
  if(!drag || e.pointerId !== drag.id) return;
  const {piece, ghost, moved} = drag;
  ghost.remove();
  piece.classList.remove("hidden");
  qBox.querySelectorAll(".slot").forEach(x=>x.classList.remove("over"));
  drag = null;
  if(moved){
    const s = slotAt(e.clientX, e.clientY);
    if(s) place(piece, s);
  }else{
    clearPick();
    picked = piece;
    piece.classList.add("picked");
  }
});
window.addEventListener("pointercancel", ()=>{
  if(!drag) return;
  drag.ghost.remove();
  drag.piece.classList.remove("hidden");
  qBox.querySelectorAll(".slot").forEach(x=>x.classList.remove("over"));
  drag = null;
});

qBox.addEventListener("click", e=>{
  const slot = e.target.closest(".slot");
  if(!slot || finished) return;
  if(picked){ place(picked, slot); return; }
  returnPiece(slot);                     // tap a filled space to take it back
});

/* ================= marking ================= */
function finish(byClock){
  if(finished) return;
  finished = true;
  clearInterval(ticker);
  let score = 0;
  quiz.forEach((item,i)=>{
    const row = qBox.querySelector('.q[data-i="' + i + '"]');
    const got = slotsOf(i).map(s => s.dataset.f || "").filter(Boolean).sort();
    const want = [...item.a].sort();
    const ok = got.length === 2 && got[0] === want[0] && got[1] === want[1];
    row.classList.add(ok ? "right" : "wrong");
    row.querySelector(".mark").textContent = ok ? "\u2713" : "\u2717";
    row.querySelector(".mark").style.color = ok ? "var(--good)" : "var(--bad)";
    if(ok) score++;
    if(!row.querySelector(".answer")){
      const p = document.createElement("p");
      p.className = "answer" + (ok ? " ok" : "");
      p.textContent = (ok ? "Correct: " : "Answer: ") + item.a.join("");
      row.appendChild(p);
    }
    if(!row.querySelector(".workwrap")){
      const wrap = document.createElement("div");
      wrap.className = "workwrap";
      const btn = document.createElement("button");
      btn.className = "workbtn"; btn.textContent = "Show working";
      const box = document.createElement("ol");
      box.className = "work";
      working(item).forEach(line=>{
        const li = document.createElement("li"); li.textContent = line; box.appendChild(li);
      });
      btn.onclick = ()=>{
        const open = box.classList.toggle("show");
        btn.textContent = open ? "Hide working" : "Show working";
      };
      wrap.appendChild(btn); wrap.appendChild(box);
      row.appendChild(wrap);
    }
  });
  tallyEl.textContent = score + " / 5";
  document.getElementById("mark").disabled = true;
  const used = TOTAL_TIME - left;
  document.getElementById("overTitle").textContent = byClock ? "Time is up" : "Finished";
  document.getElementById("overScore").textContent = score + " / 5";
  document.getElementById("overTime").textContent =
    byClock ? "You used the whole five minutes."
            : "Time used: " + Math.floor(used/60) + ":" + String(used%60).padStart(2,"0");
  document.getElementById("overNote").textContent =
    score === 5 ? "Every one correct." : "The correct answers are shown on the sheet.";
  document.getElementById("overPanel").classList.add("show");
  document.getElementById("hint").textContent = "Marked — press New 5 questions to practise again";
}

document.getElementById("mark").onclick = ()=>finish(false);
document.getElementById("fresh").onclick = build;
document.getElementById("overWorking").onclick = ()=>{
  document.getElementById("overPanel").classList.remove("show");
  document.querySelectorAll(".workbtn").forEach(btn=>{
    const box = btn.nextElementSibling;
    if(!box.classList.contains("show")){ box.classList.add("show"); btn.textContent = "Hide working"; }
  });
  document.querySelector(".q").scrollIntoView({block:"start", behavior:"smooth"});
};
document.getElementById("overAgain").onclick = build;

build();
</script>
</body>
</html>
