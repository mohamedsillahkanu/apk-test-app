<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sillah Kanu Series &mdash; Book Match</title>
<style>
  :root{
    --paper:#FFFDF6; --board:#F3EAD6; --ink:#1A1A1A; --rule:#D8CBAE;
    --tray:#3E2A18; --tray2:#573A21; --tile:64px;
    --font-hand:"Comic Sans MS","Chalkboard SE","Segoe Print","Trebuchet MS",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:var(--font-hand);background:var(--board);color:var(--ink);
       overflow:hidden;-webkit-text-size-adjust:100%;touch-action:manipulation}
  .shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{flex:0 0 auto;text-align:center;padding:7px 10px;background:var(--paper);border-bottom:3px solid var(--ink)}
  header h1{margin:0;font-size:clamp(13px,3.6vw,24px);line-height:1.2;
    text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
  header p{margin:4px 0 0;font-size:clamp(10px,2.6vw,13px);color:#6B5A42}
  main{flex:1;min-height:0;display:flex;justify-content:center;padding:8px;overflow:hidden}
  .card{flex:1;min-width:0;min-height:0;max-width:900px;width:100%;display:flex;flex-direction:column;gap:8px;
    background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:10px}
  .board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
    gap:clamp(10px,4vw,40px);position:relative}
  .slot{display:flex;align-items:center;justify-content:center;border-radius:18px;
    width:clamp(88px,24vw,168px);height:clamp(117px,32vw,224px);overflow:hidden}
  .slot img{width:100%;height:100%;object-fit:contain;display:block}
  .ask{background:#FFE9A8;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:5px}
  .drop{background:#fff;border:5px dashed var(--rule);
    transition:transform .12s ease,border-color .12s ease,background .12s ease}
  .drop.over{border-color:#1FA13A;background:#EFFBEF;transform:scale(1.05)}
  .drop.right{border:5px solid #1FA13A;background:#EFFBEF}
  .drop.wrong{border-color:#E8112D;animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
    40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  .arrow{font-size:clamp(22px,6vw,40px);color:#8A7B60}
  .face{position:absolute;left:50%;top:6px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;
    background:#FFE9A8;border:3px solid var(--ink);border-radius:22px;padding:5px 16px;
    font-size:clamp(13px,3.4vw,19px);opacity:0;transition:opacity .2s ease;pointer-events:none;z-index:4}
  .face.show{opacity:1}
  .face svg{width:26px;height:26px;display:block}
  .balloons{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .balloon{position:absolute;bottom:-90px;width:44px;height:74px;animation:rise 2.6s ease-out forwards}
  .balloon svg{width:100%;height:100%;display:block}
  @keyframes rise{0%{transform:translateY(0) rotate(0deg);opacity:0}10%{opacity:1}80%{opacity:1}
    100%{transform:translateY(calc(-1 * var(--rise))) rotate(var(--tw));opacity:0}}
  .score{flex:0 0 auto;text-align:center;font-size:clamp(12px,3.2vw,16px);color:#6B5A42}
  .tray{flex:0 0 auto;background:linear-gradient(var(--tray2),var(--tray));
    border-top:4px solid #241505;padding:6px 8px max(8px,env(safe-area-inset-bottom))}
  .traytop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
  .traytop p{margin:0;color:#FFE9C4;font-size:clamp(10px,2.8vw,13px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .traytop button{flex:0 0 auto;font-family:var(--font-hand);font-size:clamp(11px,3vw,14px);
    padding:6px 10px;border:2px solid #241505;border-radius:9px;background:#FFE9C4;cursor:pointer}
  .books{display:grid;gap:var(--gap);padding:2px 0 4px;justify-content:center;
    grid-template-columns:repeat(var(--cols), var(--tile))}
  .tile{width:var(--tile);height:calc(var(--tile) * 1.34);padding:2px;
    border:3px solid var(--ink);border-radius:10px;background:#fff;cursor:grab;touch-action:none;
    box-shadow:0 3px 0 #241505;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .tile img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
  .tile.picked{background:#FFE9A8;transform:translateY(-4px)}
  .tile.hidden{visibility:hidden}
  .flying{position:fixed;z-index:50;pointer-events:none;margin:0;
    box-shadow:0 8px 0 rgba(36,21,5,.35);transform:scale(1.12)}
  @media (min-width:700px){ .card{padding:14px;gap:10px} }
  @media (max-height:720px) and (orientation:portrait){ header p{display:none} }
  @media (max-height:560px) and (orientation:landscape){
    header{padding:4px 8px} header p{display:none} main{padding:5px} .card{padding:8px;gap:5px}
    .slot{width:clamp(64px,15vh,110px);height:clamp(85px,20vh,147px)} .score{font-size:12px}}
  @media (prefers-reduced-motion:reduce){.balloon{animation-duration:.01s}.drop.wrong{animation:none}}
</style>
</head>
<body>
<div class="shell">
<header>
  <h1>Sillah Kanu Series &mdash; Book Match</h1>
  <p>Drag the same book into the empty box</p>
</header>
<main>
  <div class="card">
    <div class="board" id="board">
      <div class="slot ask" id="ask"></div>
      <div class="arrow">&#10230;</div>
      <div class="slot drop" id="drop" aria-label="Put the matching book here"></div>
      <div class="balloons" id="balloons"></div>
      <div class="face" id="face"><span id="faceIcon"></span><span id="faceText"></span></div>
    </div>
    <p class="score" id="score">Matched 0</p>
  </div>
</main>
<div class="tray">
  <div class="traytop">
    <p id="hint">Find the same book</p>
    <button id="again">New book</button>
  </div>
  <div class="books" id="books"></div>
</div>
</div>

const askEl=document.getElementById("ask"), dropEl=document.getElementById("drop");
const trayEl=document.getElementById("books"), faceEl=document.getElementById("face");
const balloonBox=document.getElementById("balloons");
let target=0, matched=0, busy=false, picked=null;

const canSpeak="speechSynthesis" in window; let voice=null;
function pickVoice(){ if(!canSpeak) return null; let vs=[];
  try{ vs=speechSynthesis.getVoices()||[]; }catch(e){ return null; }
  const en=vs.filter(v=>/^en/i.test(v.lang||""));
  return en.find(v=>/GB|UK/i.test(v.lang))||en[0]||vs[0]||null; }
if(canSpeak){ voice=pickVoice(); try{ speechSynthesis.onvoiceschanged=()=>{voice=pickVoice();}; }catch(e){} }
function say(t,done){ let called=false; const finish=()=>{ if(!called){called=true; if(done) done();} };
  if(!canSpeak){ setTimeout(finish,700); return; }
  try{ speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t); u.rate=.8; u.pitch=1.15;
    u.lang=(voice&&voice.lang)||"en-GB"; if(voice) u.voice=voice;
    u.onend=finish; u.onerror=finish; speechSynthesis.speak(u);
    setTimeout(finish, 900+t.length*90);
  }catch(e){ setTimeout(finish,700); } }

BOOKS.forEach((b,i)=>{ const el=document.createElement("button");
  el.className="tile"; el.dataset.i=i; el.setAttribute("aria-label",b.name);
  el.innerHTML='<img alt="'+b.name+'" src="data:image/jpeg;base64,'+b.img+'">';
  trayEl.appendChild(el); });

function fitTiles(){
  const box=trayEl.parentElement.getBoundingClientRect(); const avail=box.width-16;
  if(avail<60) return;
  const short=window.innerHeight<560;
  const budget=Math.max(78,Math.min(window.innerHeight*(short?0.42:0.34),330));
  const gap=window.innerWidth<420?5:7;
  let best={size:0,cols:8};
  for(let cols=3; cols<=15; cols++){
    const rows=Math.ceil(15/cols);
    const byW=(avail-(cols-1)*gap)/cols;
    const byH=((budget-(rows-1)*gap-26)/rows)/1.34;   // tiles are 1.34x tall
    const size=Math.min(byW,byH);
    if(size>best.size) best={size,cols};
  }
  const size=Math.max(26,Math.min(84,Math.floor(best.size)));
  const r=document.documentElement.style;
  r.setProperty("--tile",size+"px"); r.setProperty("--cols",best.cols); r.setProperty("--gap",gap+"px");
}
let fitTimer=null;
window.addEventListener("resize",()=>{clearTimeout(fitTimer); fitTimer=setTimeout(fitTiles,90);});
window.addEventListener("orientationchange",()=>setTimeout(fitTiles,140));

function imgTag(i){ return '<img alt="'+BOOKS[i].name+'" src="data:image/jpeg;base64,'+BOOKS[i].img+'">'; }

function newRound(speak){
  let n=target; while(n===target) n=Math.floor(Math.random()*BOOKS.length);
  target=n;
  askEl.innerHTML=imgTag(target);
  dropEl.innerHTML=""; dropEl.className="slot drop";
  faceEl.classList.remove("show");
  document.getElementById("hint").textContent="Find "+BOOKS[target].name;
  clearPick(); busy=false;
  if(speak) say("Find "+BOOKS[target].say);
}
function clearPick(){ picked=null; [...trayEl.children].forEach(t=>t.classList.remove("picked")); }

function showFace(kind,text){
  document.getElementById("faceIcon").innerHTML = kind==="sad"
   ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFD200" stroke="#1A1A1A" stroke-width="2"/><circle cx="9" cy="10" r="1.5" fill="#1A1A1A"/><circle cx="15" cy="10" r="1.5" fill="#1A1A1A"/><path d="M8 17c1.6-2.2 6.4-2.2 8 0" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/></svg>'
   : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFD200" stroke="#1A1A1A" stroke-width="2"/><circle cx="9" cy="10" r="1.5" fill="#1A1A1A"/><circle cx="15" cy="10" r="1.5" fill="#1A1A1A"/><path d="M8 14c1.6 2.2 6.4 2.2 8 0" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/></svg>';
  document.getElementById("faceText").textContent=text; faceEl.classList.add("show");
}
function popBalloons(){
  const cols=["#E8112D","#1E90FF","#1FA13A","#7A1FD1","#F5821F","#FF3EA5","#FFD200"];
  const board=document.getElementById("board").getBoundingClientRect();
  const rise=Math.round(board.height+140), flight=2600, spread=500;
  for(let i=0;i<9;i++){ const b=document.createElement("div"); b.className="balloon";
    b.style.left=(6+Math.random()*84)+"%"; b.style.animationDelay=(Math.random()*spread)+"ms";
    b.style.setProperty("--rise",rise+"px"); b.style.setProperty("--tw",(Math.random()*40-20)+"deg");
    const c=cols[i%cols.length];
    b.innerHTML='<svg viewBox="0 0 44 74"><path d="M22,2 C34,2 40,12 40,22 C40,34 31,44 22,44 C13,44 4,34 4,22 C4,12 10,2 22,2 Z" fill="'+c+'" stroke="#1A1A1A" stroke-width="2.5"/><path d="M22,43 L18,50 L26,50 Z" fill="'+c+'" stroke="#1A1A1A" stroke-width="2.5"/><path d="M22,50 C28,58 16,62 22,72" fill="none" stroke="#1A1A1A" stroke-width="2"/><ellipse cx="14" cy="16" rx="4" ry="6" fill="#fff" opacity=".45"/></svg>';
    balloonBox.appendChild(b); setTimeout(()=>b.remove(),flight+spread+400); }
  return flight+spread;
}
function tryBook(i){
  if(busy) return;
  if(i===target){
    busy=true; dropEl.innerHTML=imgTag(i);
    dropEl.classList.remove("over"); dropEl.classList.add("right");
    matched++; document.getElementById("score").textContent="Matched "+matched;
    showFace("happy","Well done!");
    const flight=popBalloons(); let waiting=2;
    const ready=()=>{ if(--waiting===0) newRound(true); };
    say("Yes! That is "+BOOKS[i].say, ready);
    setTimeout(ready, flight);
  } else {
    dropEl.classList.remove("over","wrong"); void dropEl.offsetWidth;
    dropEl.classList.add("wrong"); showFace("sad","Try again"); say("Try again");
    setTimeout(()=>{ dropEl.classList.remove("wrong"); faceEl.classList.remove("show"); },1600);
  }
  clearPick();
}
let drag=null;
function overDrop(x,y){ const r=dropEl.getBoundingClientRect();
  return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom; }
trayEl.addEventListener("pointerdown",e=>{
  const tile=e.target.closest(".tile"); if(!tile||busy) return;
  try{ tile.setPointerCapture(e.pointerId); }catch(err){}
  const r=tile.getBoundingClientRect(); const ghost=tile.cloneNode(true);
  ghost.classList.add("flying"); ghost.style.width=r.width+"px"; ghost.style.height=r.height+"px";
  ghost.style.left=r.left+"px"; ghost.style.top=r.top+"px";
  document.body.appendChild(ghost); tile.classList.add("hidden");
  drag={tile,ghost,id:e.pointerId,dx:e.clientX-r.left,dy:e.clientY-r.top,moved:false,startX:e.clientX,startY:e.clientY};
});
window.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.id) return;
  drag.ghost.style.left=(e.clientX-drag.dx)+"px"; drag.ghost.style.top=(e.clientY-drag.dy)+"px";
  if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>6) drag.moved=true;
  dropEl.classList.toggle("over", overDrop(e.clientX,e.clientY)&&!busy);
});
window.addEventListener("pointerup",e=>{
  if(!drag||e.pointerId!==drag.id) return;
  const {tile,ghost,moved}=drag; ghost.remove(); tile.classList.remove("hidden");
  dropEl.classList.remove("over"); drag=null;
  if(moved){ if(overDrop(e.clientX,e.clientY)) tryBook(+tile.dataset.i); }
  else { clearPick(); picked=+tile.dataset.i; tile.classList.add("picked"); say(BOOKS[picked].say); }
});
window.addEventListener("pointercancel",()=>{ if(!drag) return;
  drag.ghost.remove(); drag.tile.classList.remove("hidden"); dropEl.classList.remove("over"); drag=null; });
dropEl.addEventListener("click",()=>{ if(picked!==null) tryBook(picked); });
document.getElementById("again").onclick=()=>newRound(true);
askEl.addEventListener("click",()=>say("Find "+BOOKS[target].say));
fitTiles(); newRound(false);
</script>
